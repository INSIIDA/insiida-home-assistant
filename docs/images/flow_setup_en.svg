<svg xmlns="http://www.w3.org/2000/svg" width="760" height="566" viewBox="0 0 760 566" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="760" height="566" rx="16" fill="#FFFFFF"/><text x="380.0" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">SW01 switch: from adding to HA to setting up the scene key</text><rect x="180.0" y="62" width="400" height="62" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="380" y="90.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">1. Detach the key on the switch</text><text x="380" y="108.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Detaching is done on the switch only</text><polyline points="380,124 380,146" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.0" y="148" width="400" height="62" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="380" y="176.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">2. Then add the switch to HA via Matter</text><text x="380" y="194.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Order matters; wrong order? See chart 2</text><polyline points="380,210 380,232" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.0" y="234" width="400" height="62" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="380" y="262.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">3. Download INSIIDA in HACS</text><text x="380" y="280.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Restart HA when it finishes</text><polyline points="380,296 380,318" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.0" y="320" width="400" height="62" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="380" y="348.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">4. Add the INSIIDA integration</text><text x="380" y="366.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Settings → Devices &amp; services → Add integration</text><polyline points="380,382 380,404" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.0" y="406" width="400" height="62" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="380" y="434.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">5. Press "Configure" on INSIIDA</text><text x="380" y="452.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Pick "SD-SW01 scene key"; set single / double / long press</text><polyline points="380,468 380,490" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.0" y="492" width="400" height="50" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="380" y="523.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">Done — the key works right away</text></svg>
