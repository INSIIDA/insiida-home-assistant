<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="760" height="640" rx="16" fill="#FFFFFF"/><text x="380.0" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">SW01 开关：HA 里的场景键不对怎么办</text><rect x="170.0" y="62" width="420" height="56" rx="10" fill="#F3F0FF" stroke="#6E56CF" stroke-width="2"/><text x="380" y="96.0" text-anchor="middle" font-size="16" font-weight="700" fill="#2E2163">HA 设备页里有没有“SD-SW01 场景键”？</text><polyline points="380,118 380,140 135,140 135,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="143" y="162" font-size="13" font-weight="700" fill="#374151">有，按了有反应</text><polyline points="380,118 380,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="162" font-size="13" font-weight="700" fill="#374151">有，但按了没反应</text><polyline points="380,118 380,140 625,140 625,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="633" y="162" font-size="13" font-weight="700" fill="#374151">没有</text><rect x="20.0" y="180" width="230" height="64" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="135" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">一切正常</text><text x="135" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">直接去设置场景键</text><rect x="265.0" y="180" width="230" height="64" rx="10" fill="#FDECEC" stroke="#D04A4A" stroke-width="2"/><text x="380" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5C1616">原因</text><text x="380" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">加入 HA 后，开关上取消了分离</text><rect x="510.0" y="180" width="230" height="64" rx="10" fill="#FDECEC" stroke="#D04A4A" stroke-width="2"/><text x="625" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5C1616">原因</text><text x="625" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">加入 HA 时，开关还没分离</text><polyline points="380,244 380,268" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><polyline points="625,244 625,268" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.0" y="270" width="230" height="58" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="380" y="305.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">在开关上重新“分离”</text><rect x="510.0" y="270" width="230" height="58" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="625" y="305.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">① 在开关上“分离”</text><polyline points="380,328 380,352" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><polyline points="625,328 625,352" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.0" y="354" width="230" height="64" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="380" y="383.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">场景键恢复</text><text x="380" y="401.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">不用重新加入 HA</text><rect x="510.0" y="354" width="230" height="58" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="625" y="380.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">② HA 里删除这个开关</text><text x="625" y="398.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">设备页 ⋮ → 删除</text><text x="380" y="442" text-anchor="middle" font-size="12.5" fill="#6B7280">想让这个键从 HA 消失：</text><text x="380" y="460" text-anchor="middle" font-size="12.5" fill="#6B7280">删掉开关，重新加入</text><polyline points="625,412 625,436" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="510.0" y="438" width="230" height="58" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="625" y="473.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">③ 重新通过 Matter 加入 HA</text><polyline points="625,496 625,520" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="510.0" y="522" width="230" height="58" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="625" y="548.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">场景键出现</text><text x="625" y="566.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">再去设置单击 / 双击 / 长按</text><text x="135" y="272" text-anchor="middle" font-size="12.5" fill="#6B7280">单击约慢半秒才生效，</text><text x="135" y="290" text-anchor="middle" font-size="12.5" fill="#6B7280">这是正常的</text><text x="380" y="612" text-anchor="middle" font-size="12.5" fill="#6B7280">HA 只在加入开关的那一刻看一次有没有场景键；苹果“家庭”会自动跟着变，HA 不会。</text></svg>
