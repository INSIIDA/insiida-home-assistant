<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="760" height="640" rx="16" fill="#FFFFFF"/><text x="380.0" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">SW01 switch: scene key not right in HA?</text><rect x="170.0" y="62" width="420" height="56" rx="10" fill="#F3F0FF" stroke="#6E56CF" stroke-width="2"/><text x="380" y="96.0" text-anchor="middle" font-size="16" font-weight="700" fill="#2E2163">Is "SD-SW01 scene key" on the HA device page?</text><polyline points="380,118 380,140 135,140 135,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="143" y="162" font-size="13" font-weight="700" fill="#374151">Yes, and it works</text><polyline points="380,118 380,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="162" font-size="13" font-weight="700" fill="#374151">Yes, but no reaction</text><polyline points="380,118 380,140 625,140 625,178" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="633" y="162" font-size="13" font-weight="700" fill="#374151">No</text><rect x="20.0" y="180" width="230" height="64" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="135" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">All good</text><text x="135" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Go set up the scene key</text><rect x="265.0" y="180" width="230" height="64" rx="10" fill="#FDECEC" stroke="#D04A4A" stroke-width="2"/><text x="380" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5C1616">Cause</text><text x="380" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Un-detached after adding</text><rect x="510.0" y="180" width="230" height="64" rx="10" fill="#FDECEC" stroke="#D04A4A" stroke-width="2"/><text x="625" y="209.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5C1616">Cause</text><text x="625" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Not detached when added to HA</text><polyline points="380,244 380,268" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><polyline points="625,244 625,268" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.0" y="270" width="230" height="58" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="380" y="305.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">Detach it again</text><rect x="510.0" y="270" width="230" height="58" rx="10" fill="#FFF4E0" stroke="#D98A00" stroke-width="2"/><text x="625" y="305.0" text-anchor="middle" font-size="16" font-weight="700" fill="#5A3A00">1. Detach on the switch</text><polyline points="380,328 380,352" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><polyline points="625,328 625,352" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.0" y="354" width="230" height="64" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="380" y="383.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">Scene key works again</text><text x="380" y="401.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">No need to re-add to HA</text><rect x="510.0" y="354" width="230" height="58" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="625" y="380.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">2. Delete the switch in HA</text><text x="625" y="398.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Device page ⋮ → Delete</text><text x="380" y="442" text-anchor="middle" font-size="12.5" fill="#6B7280">To remove this key from HA:</text><text x="380" y="460" text-anchor="middle" font-size="12.5" fill="#6B7280">delete the switch and add it again</text><polyline points="625,412 625,436" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="510.0" y="438" width="230" height="58" rx="10" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="2"/><text x="625" y="473.0" text-anchor="middle" font-size="16" font-weight="700" fill="#16305F">3. Re-add to HA via Matter</text><polyline points="625,496 625,520" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="510.0" y="522" width="230" height="58" rx="10" fill="#E6F6E6" stroke="#2E9B3A" stroke-width="2"/><text x="625" y="548.0" text-anchor="middle" font-size="16" font-weight="700" fill="#14451A">Scene key appears</text><text x="625" y="566.0" text-anchor="middle" font-size="13" font-weight="400" fill="#4B5563">Set single / double / long press</text><text x="135" y="272" text-anchor="middle" font-size="12.5" fill="#6B7280">A single press acts about</text><text x="135" y="290" text-anchor="middle" font-size="12.5" fill="#6B7280">half a second late — normal</text><text x="380" y="612" text-anchor="middle" font-size="12.5" fill="#6B7280">HA only checks for the scene key when the switch is added. Apple Home follows changes; HA doesn't.</text></svg>
